
name: Docker Build and Publish

on:
  workflow_run:
    workflows: ["Maven Build and Test"]
    types:
      - completed
    branches:
      - main

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the tested source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Set up Java 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Package Maven application
      - name: Build Maven JAR
        run: mvn clean package

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and publish Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            m308/maven-project:latest
            m308/maven-project:${{ github.event.workflow_run.head_sha }}
